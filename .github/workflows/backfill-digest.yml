name: Backfill Digest

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Any date (YYYY-MM-DD) inside the week to regenerate the digest for"
        required: true
        type: string

permissions:
  contents: write

jobs:
  backfill:
    name: Regenerate digest and archive for a past week
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python src/generate_digest.py --week "${{ inputs.week }}"

      - name: Write dated archive for the week
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          week_end=$(python -c 'from datetime import date, timedelta; import sys; d = date.fromisoformat(sys.argv[1]); print((d + timedelta(days=6 - d.weekday())).isoformat())' "${{ inputs.week }}")
          echo "Archive date: $week_end"
          python src/export_data.py --date "$week_end"

      - name: Refresh live snapshot and history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python src/export_data.py --no-archive

      - name: Commit and push dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/
          git diff --cached --quiet || git commit -m "chore: backfill digest and archive for week of ${{ inputs.week }} [skip ci]"
          git push